[package]
name = "institutional-trading-system"
version = "1.0.0"
description = "Institutional Trading System Native Desktop App"
authors = ["ITS"]
edition = "2021"

[lib]
name = "institutional_trading_system_lib"
crate-type = ["rlib"]

[[bin]]
name = "institutional-trading-system"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
